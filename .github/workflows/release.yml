name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hako-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
      - name: Install PostgreSQL for integration tests
        run: brew install postgresql@18
      - name: Validate source
        run: |
          make test vet audit
          node --check internal/server/web/app.js
      - name: Prepare signing and notarization
        env:
          DEV_ID_APP_CERTIFICATE_BASE64: ${{ secrets.DEV_ID_APP_CERTIFICATE_BASE64 }}
          DEV_ID_APP_CERTIFICATE_PASSWORD: ${{ secrets.DEV_ID_APP_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for variable in DEV_ID_APP_CERTIFICATE_BASE64 DEV_ID_APP_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID TEAM_ID NOTARY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable repository secret is not configured."
              exit 1
            fi
          done
          signing_keychain="$RUNNER_TEMP/hako-signing.keychain-db"
          printf '%s' "$DEV_ID_APP_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/hako-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$signing_keychain"
          security import "$RUNNER_TEMP/hako-signing.p12" -P "$DEV_ID_APP_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$signing_keychain" > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$signing_keychain" > /dev/null
          security list-keychains -d user -s "$signing_keychain" login.keychain-db
          signing_identity="$(security find-identity -v -p codesigning "$signing_keychain" | awk -v team_id="$TEAM_ID" '/Developer ID Application:/ && index($0, "(" team_id ")") { print $2; exit }')"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::No Developer ID Application identity matches TEAM_ID."
            exit 1
          fi
          echo "::add-mask::$signing_identity"
          echo "SIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          xcrun notarytool store-credentials hako-release --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" --keychain "$signing_keychain"
          rm "$RUNNER_TEMP/hako-signing.p12"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.20.0
          args: release --clean --draft --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          NOTARY_PROFILE: hako-release
          NOTARY_KEYCHAIN: ${{ runner.temp }}/hako-signing.keychain-db
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hako-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/hako-signing.p12"
