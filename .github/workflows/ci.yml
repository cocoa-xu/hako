name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: hako_test
          POSTGRES_PASSWORD: hako_test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hako_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HAKO_TEST_DATABASE_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgres://hako_test:hako_test@127.0.0.1:5432/postgres?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
      - name: Install PostgreSQL for macOS tests
        if: runner.os == 'macOS'
        run: brew install postgresql@18
      - run: make test vet audit
      - run: node --check internal/server/web/app.js
      - run: make build
      - run: for script in scripts/*.sh; do sh -n "$script"; done
